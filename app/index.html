<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
	<title>minh</title>
	<meta name="description" content="Chat with your minh agents" />
	<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="minh" />
	<link rel="manifest" href="manifest.webmanifest" />
	<link rel="icon" href="icon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="icon-180.png" />
	<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
	<!-- First run: where the chats live. -->
	<section id="setup" class="setup" hidden>
		<div class="setup-card">
			<div class="brand"><img src="icon.svg" alt="" width="40" height="40" /><h1>minh</h1></div>
			<p>Chats live in a private GitHub repo that your minh bridge watches.</p>
			<form id="setup-form">
				<label>Name
					<input name="name" placeholder="This PC, Server…" autocomplete="off" />
				</label>
				<label>Chat repo
					<input name="repo" placeholder="your-name/minh-chat" autocomplete="off" autocapitalize="off" spellcheck="false" required />
				</label>
				<label>GitHub token
					<input name="token" type="password" placeholder="github_pat_…" autocomplete="off" required />
				</label>
				<p class="hint">A fine-grained token from <b>your</b> account, for this one repo: Issues and Contents, read and write. It stays on this phone.</p>
				<details class="advanced">
					<summary>Advanced</summary>
					<label>API address
						<input name="apiBase" placeholder="https://api.github.com" autocomplete="off" autocapitalize="off" spellcheck="false" />
					</label>
				</details>
				<p id="setup-error" class="error" hidden></p>
				<button type="submit" class="primary">Connect</button>
				<button type="button" id="setup-back" class="link center" hidden>Back</button>
			</form>
		</div>
	</section>

	<div id="app" class="app" hidden>
		<aside id="drawer" class="drawer" aria-label="Chats">
			<div class="drawer-head">
				<div class="brand small"><img src="icon.svg" alt="" width="26" height="26" /><span>minh</span></div>
				<button id="drawer-new" class="pill">New chat</button>
			</div>
			<input id="search" class="search" type="search" placeholder="Search chats" autocomplete="off" />
			<nav id="chat-list" class="chat-list"></nav>
			<div class="drawer-foot">
				<button id="archived-btn" class="link">Archived chats</button>
				<button id="notify-btn" class="link">Turn on notifications</button>
				<button id="conn-btn" class="conn" aria-label="Switch connection">
					<span class="conn-text"><b id="conn-name"></b><small id="account-name"></small></span>
					<svg viewBox="0 0 24 24" width="16" height="16"><path d="M8 9l4-4 4 4M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
				</button>
				<p id="app-version" class="app-version"></p>
			</div>
		</aside>
		<div id="scrim" class="scrim" hidden></div>

		<main class="main">
			<header class="topbar">
				<button id="menu-btn" class="icon-btn" aria-label="Chats">
					<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
				</button>
				<h2 id="chat-title" class="title">minh</h2>
				<button id="chat-menu-btn" class="icon-btn" aria-label="Chat options" hidden>
					<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>
				</button>
				<button id="new-btn" class="icon-btn" aria-label="New chat">
					<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
				</button>
			</header>

			<div id="scroller" class="scroller">
				<div id="empty" class="empty">
					<img src="icon.svg" alt="" width="44" height="44" />
					<p id="greeting">What should we work on?</p>
				</div>
				<div id="messages" class="messages"></div>
			</div>

			<form id="composer" class="composer">
				<div class="composer-box">
					<textarea id="input" rows="1" placeholder="Message minh" enterkeyhint="send"></textarea>
					<div class="composer-row">
						<button id="options-btn" type="button" class="chip" aria-label="Model and settings">
							<span id="options-label">Model</span>
							<svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
						</button>
						<button id="stop-btn" type="button" class="send stop" aria-label="Stop" hidden>
							<svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
						</button>
						<button id="send-btn" type="submit" class="send" aria-label="Send" disabled>
							<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
						</button>
					</div>
				</div>
				<p id="status-line" class="status-line"></p>
			</form>
		</main>
	</div>

	<!-- Model and settings, for the next chat or the open one. -->
	<div id="sheet-scrim" class="scrim sheet-scrim" hidden></div>
	<form id="options-sheet" class="sheet" hidden>
		<div class="sheet-grip"></div>
		<h3 id="sheet-title">New chat settings</h3>
		<label>Provider
			<select id="opt-provider"></select>
		</label>
		<label>Model
			<select id="opt-model"></select>
			<input id="opt-model-text" placeholder="Model id" autocomplete="off" autocapitalize="off" spellcheck="false" hidden />
		</label>
		<label>Folder
			<select id="opt-folder"></select>
			<input id="opt-folder-text" placeholder="new-project or C:\full\path" autocomplete="off" autocapitalize="off" spellcheck="false" hidden />
		</label>
		<div id="folder-new" class="folder-new" hidden>
			<label class="check"><input id="opt-folder-create" type="checkbox" checked /> Create it if missing</label>
			<p id="folder-new-hint" class="hint"></p>
		</div>
		<div class="field">
			<span>Mode</span>
			<div class="segmented" data-name="mode">
				<button type="button" data-value="act">Act</button>
				<button type="button" data-value="plan">Plan</button>
			</div>
		</div>
		<div class="field">
			<span>Tools</span>
			<div class="segmented" data-name="autoApprove">
				<button type="button" data-value="true">Run freely</button>
				<button type="button" data-value="false">Ask me</button>
			</div>
		</div>
		<p id="sheet-hint" class="hint"></p>
		<button type="submit" class="primary">Done</button>
	</form>

	<!-- One chat's actions: from the ⋯ button, or a long press in the list. -->
	<div id="actions-sheet" class="sheet actions" hidden>
		<div class="sheet-grip"></div>
		<h3 id="actions-title"></h3>
		<button type="button" data-act="rename">Rename</button>
		<button type="button" data-act="pin">Pin</button>
		<button type="button" data-act="archive">Archive</button>
		<button type="button" data-act="delete" class="danger">Delete</button>
	</div>

	<!-- Connections: one per machine's bridge (each its own repo). -->
	<div id="conn-sheet" class="sheet actions" hidden>
		<div class="sheet-grip"></div>
		<h3>Connections</h3>
		<div id="conn-list" class="conn-list"></div>
		<button type="button" data-conn="add">+ Add a connection</button>
		<button type="button" data-conn="rename">Rename this one</button>
		<button type="button" data-conn="remove" class="danger">Remove this one from the phone</button>
	</div>

	<div id="toast" class="toast" hidden></div>
	<!-- Bump ?v= with each app change so a cached old file is never paired with a new page. -->
	<script type="module" src="app.js?v=5"></script>
</body>
</html>
